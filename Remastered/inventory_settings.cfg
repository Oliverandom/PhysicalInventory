// Inventory settings (read once at startup by the engine).
// Lines are "key=number"; anything else is ignored.
//
// inventoryKey = SDL scancode of the key that opens/closes the inventory.
//   Common scancodes: TAB=43, I=12, B=5, N=17, backslash=49, Insert=73.
// showEditMenu = 1 to show the debug opacity/outline sliders, 0 to hide them.

inventoryKey=43
showEditMenu=0
